name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Push only when Docker Hub credentials are configured as repo secrets
      CAN_PUSH: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/kyc-jordan:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/kyc-jordan:${{ github.sha }}

      - name: Note when push was skipped
        if: env.CAN_PUSH != 'true' && github.event_name != 'pull_request'
        run: echo "::notice::Image built but not pushed. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repo secrets to publish to Docker Hub."
